# hypr-shell: Sperrbildschirm im Stil des Desktops.
# Hintergrund = aktueller Bildschirm, unscharf und abgedunkelt; Inhalt links.
# Farben aus dem Hintergrundbild (hyprlock-colors.conf, von matugen geschrieben).

# Standardfarben (grau), danach die Farben aus dem Hintergrundbild
$accent = rgba(d4d4d4ff)
$text = rgba(e6e6e6f2)
$text_dim = rgba(e6e6e68c)
$subtext = rgba(c8c8c8e6)
$error = rgba(dc5050ff)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    contrast = 0.9
    vibrancy = 0.1
    color = rgba(18, 18, 20, 1.0)
}

# Profilbild (~/.face)
image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 2
    border_color = $text_dim
    position = 110, 380
    halign = left
    valign = center
}

# grosse gestapelte Uhr, 24 Stunden
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $text
    font_size = 130
    font_family = Bebas Neue
    position = 106, 230
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $text_dim
    font_size = 130
    font_family = Bebas Neue
    position = 106, 90
    halign = left
    valign = center
}

# Datum und Begrüssung
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date '+%A, %d %B'
    color = $subtext
    font_size = 17
    font_family = Inter
    position = 110, -10
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] ~/.local/bin/shell-greeting
    color = $text
    font_size = 15
    font_family = Inter SemiBold
    position = 110, -44
    halign = left
    valign = center
}

# Passwortfeld als schlichte Linie
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(00000000)
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = false
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">Password</span>
    fail_text = <span foreground="##ff8080">$FAIL</span>
    check_color = $accent
    fail_color = $error
    position = 110, -118
    halign = left
    valign = center
}
shape {
    monitor =
    size = 300, 2
    color = $text_dim
    rounding = 0
    border_size = 0
    position = 110, -144
    halign = left
    valign = center
}

# Standby, Neustart, Herunterfahren
label {
    monitor =
    text = 󰤄
    color = $text_dim
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl suspend
    position = 110, -210
    halign = left
    valign = center
}
label {
    monitor =
    text = 󰜉
    color = $text_dim
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl reboot
    position = 180, -210
    halign = left
    valign = center
}
label {
    monitor =
    text = 󰐥
    color = $text_dim
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl poweroff
    position = 250, -210
    halign = left
    valign = center
}
