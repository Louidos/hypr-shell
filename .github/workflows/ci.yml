name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (shellcheck, Lua, QML, JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4 jq qt6-declarative-dev-tools
      - name: Prüfen
        run: PATH="$PATH:/usr/lib/qt6/bin" tests/lint.sh

  arch:
    name: Probelauf in archlinux:latest
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Grundpakete
        run: pacman -Syu --noconfirm --needed git sudo jq which imagemagick lua curl sway swaybg grim quickshell hyprlock awww matugen waybar inter-font ttf-jetbrains-mono-nerd noto-fonts papirus-icon-theme hyprland libnotify dbus cliphist wl-clipboard rclone fuse3
      - uses: actions/checkout@v4
      - name: Testbenutzer anlegen
        run: |
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
      - name: install.sh --dry-run
        run: su tester -c "cd '$GITHUB_WORKSPACE' && ./install.sh --dry-run --yes"
      - name: Weitere Tests
        run: |
          for t in tests/*.sh; do
            [ "$t" = tests/lint.sh ] && continue
            echo "== $t"
            su tester -c "cd '$GITHUB_WORKSPACE' && SCREENSHOTS='$GITHUB_WORKSPACE/screenshots-ci' $t"
          done
      - name: Screenshots der Oberfläche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots-ci/
          if-no-files-found: ignore
      - name: Screenshots in den Branch ci/screenshots legen
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUELLE: ${{ github.head_ref }}
        run: |
          [ -d screenshots-ci ] && [ -n "$(ls -A screenshots-ci)" ] || exit 0
          git config --global --add safe.directory '*'
          cd screenshots-ci
          git init -q -b ci/screenshots
          git config user.name "CI"
          git config user.email "ci@localhost"
          git add -A
          git commit -qm "Screenshots aus $QUELLE ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/ci/screenshots
